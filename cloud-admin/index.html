<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DasturXon — Super Admin</title>
<style>
  :root { --bg:#0f1216; --surface:#171b21; --border:#2a3038; --text:#e7ecf2; --muted:#8b95a3; --green:#22c55e; --red:#ef4444; --amber:#f59e0b; --primary:#10b981; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  a,button { font-family:inherit; }
  .wrap { max-width:1100px; margin:0 auto; padding:16px; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:20px; }
  input { width:100%; padding:11px 12px; border-radius:10px; background:var(--bg); border:1px solid var(--border); color:var(--text); outline:none; font-size:15px; }
  input:focus { border-color:var(--primary); }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  button { cursor:pointer; border:none; border-radius:10px; padding:10px 16px; font-weight:700; font-size:14px; }
  .btn { background:var(--primary); color:#04120c; }
  .btn:hover { filter:brightness(1.08); }
  .btn-ghost { background:var(--bg); color:var(--text); border:1px solid var(--border); }
  .btn-danger { background:rgba(239,68,68,.15); color:var(--red); }
  .btn-warn { background:rgba(245,158,11,.15); color:var(--amber); }
  .row { display:flex; align-items:center; gap:10px; }
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:10px; flex-wrap:wrap; }
  .title { font-weight:800; font-size:22px; color:var(--primary); }
  .rest { border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:10px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .dot { width:11px; height:11px; border-radius:50%; flex:none; }
  .key { font-family:ui-monospace,Menlo,monospace; font-size:22px; font-weight:800; letter-spacing:2px; }
  .muted { color:var(--muted); font-size:13px; }
  .pill { font-size:12px; font-weight:700; padding:3px 9px; border-radius:999px; }
  .spacer { flex:1; }
  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; padding:16px; }
  .modal { max-width:440px; width:100%; }
  .hide { display:none; }
  .keybox { background:var(--bg); border:1px dashed var(--primary); border-radius:12px; padding:16px; text-align:center; margin:12px 0; }
</style>
</head>
<body>
<div class="wrap">

  <!-- LOGIN -->
  <div id="login" class="card" style="max-width:420px;margin-top:8vh">
    <div class="title" style="margin-bottom:4px">DasturXon</div>
    <div class="muted" style="margin-bottom:16px">Super Admin panel</div>
    <label>Bulut API manzili</label>
    <input id="api" placeholder="http://localhost:4000/api" />
    <label>Parol</label>
    <input id="pw" type="password" placeholder="Platforma paroli" />
    <div id="loginErr" class="muted" style="color:var(--red);margin-top:8px"></div>
    <button class="btn" style="width:100%;margin-top:14px" onclick="login()">Kirish</button>
  </div>

  <!-- PANEL -->
  <div id="panel" class="hide">
    <div class="header">
      <div class="title">🏪 Restoranlar</div>
      <div class="row">
        <span id="stat" class="muted"></span>
        <button class="btn" onclick="openCreate()">＋ Restoran</button>
        <button class="btn-ghost" onclick="logout()">Chiqish</button>
      </div>
    </div>
    <div id="list"></div>
  </div>

  <!-- CREATE MODAL -->
  <div id="createBg" class="modal-bg hide">
    <div class="card modal">
      <div class="title" style="font-size:18px;margin-bottom:6px">Yangi restoran</div>
      <div id="createForm">
        <label>Restoran nomi</label>
        <input id="cName" placeholder="Masalan: Osh Markazi" />
        <label>Telefon (ixtiyoriy)</label>
        <input id="cPhone" placeholder="+998 90 123 45 67" />
        <div class="row" style="margin-top:16px;justify-content:flex-end">
          <button class="btn-ghost" onclick="closeCreate()">Bekor</button>
          <button class="btn" onclick="createRest()">Yaratish</button>
        </div>
      </div>
      <div id="createDone" class="hide">
        <div class="muted">Restoran yaratildi. Qurilmaga o'rnatishda shu kalitni kiriting:</div>
        <div class="keybox">
          <div class="muted">Litsenziya kaliti</div>
          <div id="newKey" class="key" style="color:var(--primary)"></div>
        </div>
        <button class="btn" style="width:100%" onclick="closeCreate()">Yopish</button>
      </div>
    </div>
  </div>

</div>
<script>
let API = localStorage.getItem('sa_api') || 'http://localhost:4000/api';
let KEY = localStorage.getItem('sa_key') || '';
document.getElementById('api').value = API;

async function req(path, opts={}) {
  const r = await fetch(API + path, {
    ...opts,
    headers: { 'Content-Type':'application/json', 'x-platform-key': KEY, ...(opts.headers||{}) },
  });
  if (!r.ok) throw new Error((await r.json().catch(()=>({}))).message || ('HTTP '+r.status));
  return r.json();
}

async function login() {
  API = document.getElementById('api').value.trim().replace(/\/$/,'');
  const pw = document.getElementById('pw').value;
  document.getElementById('loginErr').textContent = '';
  try {
    const r = await fetch(API + '/admin/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password: pw }) });
    if (!r.ok) throw new Error('Parol noto‘g‘ri');
    const data = await r.json();
    KEY = data.key;
    localStorage.setItem('sa_api', API);
    localStorage.setItem('sa_key', KEY);
    showPanel();
  } catch (e) { document.getElementById('loginErr').textContent = e.message; }
}
function logout() { localStorage.removeItem('sa_key'); KEY=''; location.reload(); }

function showPanel() {
  document.getElementById('login').classList.add('hide');
  document.getElementById('panel').classList.remove('hide');
  load();
}

function fmtTime(t) {
  if (!t) return '—';
  const d = new Date(t), diff = (Date.now()-d.getTime())/1000;
  if (diff < 60) return 'hozir';
  if (diff < 3600) return Math.floor(diff/60)+' daq oldin';
  if (diff < 86400) return Math.floor(diff/3600)+' soat oldin';
  return d.toLocaleString('uz-UZ');
}

async function load() {
  try {
    const rows = await req('/admin/restaurants');
    const online = rows.filter(r=>r.online).length;
    document.getElementById('stat').textContent = rows.length + ' ta · ' + online + ' online';
    document.getElementById('list').innerHTML = rows.map(renderRest).join('') || '<div class="muted">Hali restoran yo‘q.</div>';
  } catch (e) {
    if (String(e.message).includes('401') || String(e.message).includes('kalit')) logout();
  }
}

function renderRest(r) {
  const dot = r.online ? 'var(--green)' : 'var(--muted)';
  const statusPill = r.active
    ? '<span class="pill" style="background:rgba(34,197,94,.15);color:var(--green)">Faol</span>'
    : '<span class="pill" style="background:rgba(239,68,68,.15);color:var(--red)">Bloklangan</span>';
  const actPill = r.activated
    ? '<span class="pill" style="background:rgba(16,185,129,.12);color:var(--primary)">O‘rnatilgan</span>'
    : '<span class="pill" style="background:rgba(245,158,11,.15);color:var(--amber)">Kutilmoqda</span>';
  return `<div class="rest">
    <span class="dot" style="background:${dot}"></span>
    <div style="min-width:180px">
      <div style="font-weight:700;font-size:16px">${esc(r.name)} ${statusPill} ${actPill}</div>
      <div class="muted">${esc(r.phone||'')} ${r.lastIp?('· '+r.lastIp):''} ${r.appVersion?('· v'+r.appVersion):''}</div>
      <div class="muted">Oxirgi: ${fmtTime(r.lastSeenAt)}</div>
    </div>
    <div class="spacer"></div>
    <div style="text-align:center">
      <div class="muted">Kalit</div>
      <div class="key">${r.licenseKey||'—'}</div>
    </div>
    <div class="row">
      <button class="${r.active?'btn-warn':'btn'}" onclick="toggleActive('${r.id}', ${!r.active})">${r.active?'Bloklash':'Faollashtirish'}</button>
      <button class="btn-ghost" onclick="resetDevice('${r.id}')" title="Qurilma almashtirilganda">Qurilmani almashtirish</button>
      <button class="btn-danger" onclick="removeRest('${r.id}','${esc(r.name)}')">O‘chirish</button>
    </div>
  </div>`;
}
function esc(s){ return String(s||'').replace(/[<>&"]/g, c=>({ '<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;' }[c])); }

async function toggleActive(id, active) { await req('/admin/restaurants/'+id, { method:'PATCH', body: JSON.stringify({ active }) }); load(); }
async function resetDevice(id) { if(!confirm('Bu restoran kalitini yangi qurilmaga o‘rnatishga ruxsat berilsinmi? (eski o‘rnatma o‘chadi)')) return; await req('/admin/restaurants/'+id+'/reset-device', { method:'POST' }); load(); }
async function removeRest(id,name) { if(!confirm(name+' — o‘chirilsinmi?')) return; await req('/admin/restaurants/'+id, { method:'DELETE' }); load(); }

function openCreate(){ document.getElementById('createBg').classList.remove('hide'); document.getElementById('createForm').classList.remove('hide'); document.getElementById('createDone').classList.add('hide'); document.getElementById('cName').value=''; document.getElementById('cPhone').value=''; }
function closeCreate(){ document.getElementById('createBg').classList.add('hide'); load(); }
async function createRest(){
  const name = document.getElementById('cName').value.trim();
  if (!name) return;
  const phone = document.getElementById('cPhone').value.trim();
  const r = await req('/admin/restaurants', { method:'POST', body: JSON.stringify({ name, phone }) });
  document.getElementById('newKey').textContent = r.licenseKey;
  document.getElementById('createForm').classList.add('hide');
  document.getElementById('createDone').classList.remove('hide');
}

// Avto-yangilanish (online holat)
setInterval(() => { if (KEY && !document.getElementById('panel').classList.contains('hide')) load(); }, 15000);
if (KEY) showPanel();
</script>
</body>
</html>
